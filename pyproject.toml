[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
# Pattern chuẩn: KHÔNG dùng "tests/**/test_*.py" — glob đó không khớp file nằm trực
# tiếp trong tests/ ⇒ `pytest` / `make test` thu 0 test (bug cấu hình cũ).
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--reuse-db --no-migrations -v"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true