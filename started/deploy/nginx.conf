# IQCG - Nginx reverse proxy (Production Linux)
# /etc/nginx/sites-available/iqcg

upstream iqcg_app  { server 127.0.0.1:8000; }
upstream iqcg_ws   { server 127.0.0.1:8001; }

server {
    listen 80;
    server_name iqcg.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name iqcg.example.com;

    # certbot manages these
    ssl_certificate     /etc/letsencrypt/live/iqcg.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iqcg.example.com/privkey.pem;

    client_max_body_size 25m;

    location /static/  { alias /opt/iqcg/staticfiles/; }
    location /media/   { alias /opt/iqcg/media/; }

    # WebSocket (Django Channels)
    location /ws/ {
        proxy_pass http://iqcg_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # AI (chat SSE) - stream nhieu giay, dung config rieng vi `location /` phia duoi
    # se cat stream (proxy_read_timeout 120s) va GZip se gom het thanh 1 lan gui
    # => user thay chatbot 'dung im 90 giay roi hien tat ca'.
    location /api/v1/ai/ {
        # Giu nguyen chinh sach POST-only cua `location /` (prefix location thang
        # nen neu khong khai lai o day thi PUT/PATCH/DELETE se lot qua proxy).
        limit_except GET POST OPTIONS {
            deny all;
        }

        proxy_pass http://iqcg_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        # 600s: Ollama co the suy nghi toi da 300s (xem OLLAMA_TIMEOUT).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # KHONG buffer - giu nguyen tung frame SSE den ngay client.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # Chat KHONG compress: GZip o tang Django + gzip o day deu lam gom het
        # stream truoc khi gui => mat cam giac 'chu chay dan'.
        gzip off;
    }
    location / {
        # Chính sách POST-only: chặn PUT/PATCH/DELETE ngay tại proxy (defense in depth)
        limit_except GET POST OPTIONS {
            deny all;
        }

        proxy_pass http://iqcg_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }
}
