# IQCG - Apache (XAMPP) reverse proxy for Django
# C:\xampp\apache\conf\extra\httpd-django.conf
# Requires: mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_ssl

<VirtualHost *:80>
    ServerName iqcg.local
    ProxyPreserveHost On
    ProxyRequests Off

    # Serve static/media directly (skip proxy)
    ProxyPass        /static/ !
    ProxyPass        /media/  !
    Alias  /static/  "E:/VsCode/django/staticfiles/"
    Alias  /media/   "E:/VsCode/django/media/"
    <Directory "E:/VsCode/django/staticfiles">
        Require all granted
    </Directory>
    <Directory "E:/VsCode/django/media">
        Require all granted
    </Directory>

    # WebSocket -> Daphne (8001)
    ProxyPass        /ws/ ws://127.0.0.1:8001/ws/
    ProxyPassReverse /ws/ ws://127.0.0.1:8001/ws/

    # HTTP -> Waitress/Gunicorn (8000)
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>

# HTTPS — ensure this block is enabled inside C:\xampp\apache\conf\extra\httpd-ssl.conf
# (or copy the proxy directives above into the existing _default_:443 vhost).
# <VirtualHost *:443>
#     ServerName iqcg.local
#     SSLEngine on
#     SSLCertificateFile    "conf/ssl.crt/server.crt"
#     SSLCertificateKeyFile "conf/ssl.key/server.key"
#     ...same ProxyPass / Alias directives as above...
#     RequestHeader set X-Forwarded-Proto "https"
# </VirtualHost>
