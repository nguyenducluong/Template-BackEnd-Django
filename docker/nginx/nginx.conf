upstream django_api {
    server api:8000;
}

server {
    listen 80;
    server_name localhost;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # SSL configuration (add your certs in production)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    client_max_body_size 100M;

    # Static files
    location /static/ {
        alias /app/staticfiles/;
    }

    # Media files
    location /media/ {
        alias /app/media/;
    }

    # AI (chat SSE) - stream nhieu giay, config rieng: `location /` phia duoi se
    # cat stream (proxy_read_timeout mac dinh 60s) va GZip se gom het thanh 1 lan gui.
    location /api/v1/ai/ {
        # Giu nguyen chinh sach POST-only (prefix location thang `location /`).
        limit_except GET POST OPTIONS {
            deny all;
        }

        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;
    }
    # API proxy
    location / {
        # Chính sách POST-only (defense in depth): chặn PUT/PATCH/DELETE ngay tại
        # proxy, không cần chờ tới Django. API chỉ dùng GET/POST/OPTIONS.
        limit_except GET POST OPTIONS {
            deny all;
        }

        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}